<!DOCTYPE html>
<html>
<head>
    <title>Vista AI - Summarize</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h2>Summarize Video, Text or Document</h2>
        <form method="POST" action="/summarize" enctype="multipart/form-data">
            <h4>Paste YouTube Link</h4>
            <input type="text" name="youtube_url" placeholder="https://www.youtube.com/watch?v=...">
            
            <h4>OR Upload File (PDF, DOCX, TXT)</h4>
            <input type="file" name="doc_file" accept=".pdf,.docx,.txt" style="color: white; margin-bottom: 15px;">
            
            <h4>OR Paste Your Text</h4>
            <textarea name="text_input" rows="5" placeholder="Paste your text here..."></textarea>
            
            <h4>Summary Settings</h4>
            <select name="length">
                <option value="3">Short (3 sentences)</option>
                <option value="5" selected>Medium (5 sentences)</option>
                <option value="8">Detailed (8 sentences)</option>
            </select>
            
            <select name="format">
                <option value="points">Bullet Points</option>
                <option value="paragraph">Paragraph</option>
            </select>
            
            <button type="submit">Summarize Now</button>
        </form>
        <br>
        <a href="/dashboard">Back to Dashboard</a>
    </div>
</body>
</html>
